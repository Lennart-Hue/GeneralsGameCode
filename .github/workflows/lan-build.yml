name: LAN Build

# Builds Zero Hour with RETAIL_COMPATIBLE_NETWORKING disabled (see GameDefines.h).
# vc6-weekly matches the toolchain of the official weekly releases; win32 is a fallback build.
# Never mix the two builds in one match.

permissions:
  contents: read

on:
  push:
    branches:
      - lan-stable
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-generalsmd:
    name: Build GeneralsMD${{ matrix.preset && '' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "vc6-weekly"
            tools: false
          # The artifact collect step needs the Core output folder, which win32 presets only create when tools are built.
          - preset: "win32"
            tools: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: false
